name: Deploy FoodApp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/foodapp

            git pull origin main

            cd backend
            npm install

            pm2 restart foodapp-api || pm2 start src/server.js --name foodapp-api

            cd ../frontend
            npm install

            npm run build
