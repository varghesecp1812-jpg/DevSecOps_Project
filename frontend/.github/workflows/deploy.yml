name: Deploy FoodApp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}

          script: |

            cd ~/foodapp

            git pull origin main

            # Backend
            cd backend
            npm install

            pm2 restart foodapp-api || pm2 start src/server.js --name foodapp-api

            # Frontend
            cd ../frontend

            npm install

            npm run build

            sudo systemctl restart nginx
